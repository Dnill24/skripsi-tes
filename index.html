<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Quest Adventure</title>
  <meta name="description" content="A math adventure game for elementary students!" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/locales.js?v=3"></script>
  <script src="js/sfx.js"></script>
  <script>tailwind.config = { theme: { extend: {} } }</script>

</head>
<body class="bg-hub">
<div class="menu-layout">

  <!-- Title Card (top-left) -->
  <div class="menu-logo-container">
    <div class="title-sign">
      <h1>MATH QUEST</h1>
      <p>Sandbox Adventure</p>
    </div>
  </div>

  <!-- Menu Panel (bottom-right) -->
  <div class="menu-panel-container">
    <div class="stone-panel menu-panel">
      <div class="flex-col-gap-12">
        <button id="playButton" class="wood-btn success">
          <span class="btn-icon">⚔️</span><span data-i18n="menu_play">Play</span>
        </button>

        <!-- Play sub-options -->
        <div id="playOptions" class="flex flex-col gap-3 hidden">
          <button id="guestButton" class="wood-btn">
            <span class="btn-icon">🧑‍🌾</span><span data-i18n="menu_guest">Guest Mode</span>
          </button>
          <button id="loginButton" class="wood-btn">
            <span class="btn-icon">🔑</span><span data-i18n="menu_login">Login</span>
          </button>
          <button id="signupButton" class="wood-btn">
            <span class="btn-icon">📝</span><span data-i18n="menu_signup">Sign Up</span>
          </button>
          <button id="exitButton" class="wood-btn danger">
            <span class="btn-icon">🔙</span><span data-i18n="menu_back">Back</span>
          </button>
        </div>

        <button id="settingsButton" class="wood-btn">
          <span class="btn-icon">⚙️</span><span data-i18n="menu_settings">Settings</span>
        </button>
    </div>
  </div>

</div>

<!-- Language Prompt Modal -->
<div class="terra-modal-overlay" id="langPromptModal">
  <div class="terra-modal-card">
    <h2 class="text-center mb-4 leading-tight">Select Language<br><span class="text-lg text-yellow-400">Pilih Bahasa</span></h2>
    <div class="flex-col-gap-10" style="display: flex; flex-direction: column; gap: 10px;">
      <button id="btnLangEn" class="wood-btn w-full justify-center">English</button>
      <button id="btnLangId" class="wood-btn w-full justify-center">Bahasa Indonesia</button>
    </div>
  </div>
</div>

<!-- Login Modal -->
<div class="terra-modal-overlay" id="loginModal">
  <div class="terra-modal-card">
    <h2 data-i18n="menu_login_title">WELCOME BACK</h2>
    <label for="usernameInput" data-i18n="menu_char_name">Character Name</label>
    <input id="usernameInput" type="text" autocomplete="username" />
    <label for="passwordInput" data-i18n="menu_password">Password</label>
    <div class="password-container">
      <input id="passwordInput" type="password" class="password-input" placeholder="..." autocomplete="current-password" />
      <button type="button" id="toggleLoginPassword" class="password-toggle">👁️</button>
    </div>
    <div class="flex-row-gap-12-mt20">
      <button id="loginSubmitButton" class="wood-btn success flex-1">
        <span class="btn-icon">🚀</span><span data-i18n="menu_login">Login</span>
      </button>
      <button id="cancelLogin" class="wood-btn danger flex-1">
        <span class="btn-icon">❌</span><span data-i18n="menu_cancel">Cancel</span>
      </button>
    </div>
    <!-- Sign-up hint -->
    <p class="text-sm text-center mt-3" id="loginSignupHint"><span data-i18n="txt_no_account">Don't have an account yet?</span> <a href="#" id="loginSignupLink" class="text-yellow-300 underline" data-i18n="txt_signup_here">Sign up here</a></p>
  </div>
</div>

<!-- Signup Modal -->
<div class="terra-modal-overlay" id="signupModal">
  <div class="terra-modal-card">
    <h2 data-i18n="menu_signup">CREATE ACCOUNT</h2>
    <label for="signupUsernameInput" data-i18n="menu_char_name">Character Name</label>
    <input id="signupUsernameInput" type="text" data-i18n-placeholder="plc_hero" placeholder="e.g. Hero" autocomplete="username" />
    <label for="signupPasswordInput" data-i18n="menu_password">Password</label>
    <div class="password-container">
      <input id="signupPasswordInput" type="password" class="password-input" placeholder="..." autocomplete="new-password" />
      <button type="button" id="toggleSignupPassword" class="password-toggle">👁️</button>
    </div>
    <label for="signupConfirmPasswordInput" data-i18n="menu_confirm_password">Confirm Password</label>
    <div class="password-container">
      <input id="signupConfirmPasswordInput" type="password" class="password-input" placeholder="..." autocomplete="new-password" />
      <button type="button" id="toggleSignupConfirmPassword" class="password-toggle">👁️</button>
    </div>
    <div class="flex-row-gap-12-mt20">
      <button id="signupSubmitButton" class="wood-btn success flex-1">
        <span class="btn-icon">✨</span><span data-i18n="menu_signup">Sign Up</span>
      </button>
      <button id="cancelSignup" class="wood-btn danger flex-1">
        <span class="btn-icon">❌</span><span data-i18n="menu_cancel">Cancel</span>
      </button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="terra-modal-overlay" id="settingsModal">
  <div class="terra-modal-card max-w-[440px]">
    <button id="xCloseSettings" class="modal-close-btn absolute top-3 right-3 z-20">X</button>
    <div class="mb-6 mt-3">
      <h2 class="fancy-header m-0" data-i18n="modal_settings">⚙️ Settings</h2>
    </div>
    <div class="flex flex-col gap-6">
      <div class="flex items-center justify-between">
        <label for="musicVolumeSlider" class="m-0"><span class="text-[1.2rem] align-middle mr-1">🎵</span> <span data-i18n="lbl_music_volume">Music</span></label>
        <div class="flex items-center gap-3">
          <input type="range" id="musicVolumeSlider" min="0" max="100" value="50" class="settings-slider">
          <span id="musicVolumeValue" class="font-minecraft text-[0.6rem] text-yellow-400 min-w-[3rem] drop-shadow-[1px_1px_0_rgba(0,0,0,0.8)]">50%</span>
        </div>
      </div>
      <div class="flex items-center justify-between">
        <label for="sfxVolumeSlider" class="m-0"><span class="text-[1.2rem] align-middle mr-1">🔊</span> <span data-i18n="lbl_sfx_volume">SFX</span></label>
        <div class="flex items-center gap-3">
          <input type="range" id="sfxVolumeSlider" min="0" max="100" value="70" class="settings-slider">
          <span id="sfxVolumeValue" class="font-minecraft text-[0.6rem] text-yellow-400 min-w-[3rem] drop-shadow-[1px_1px_0_rgba(0,0,0,0.8)]">70%</span>
        </div>
      </div>
      <div class="flex items-center justify-between gap-4">
        <label for="languageSelect" class="m-0 whitespace-nowrap"><span class="text-[1.2rem] align-middle mr-1">🌐</span> <span data-i18n="lbl_language">Language</span></label>
        <select id="languageSelect" class="m-0 w-[130px] p-2 bg-[#455a64] border-2 border-[var(--panel-border)] text-white rounded">
          <option value="en">English</option>
          <option value="id">Bahasa Indonesia</option>
        </select>
      </div>
    </div>
    <div class="flex gap-3 mt-8">
      <button id="saveSettings"  class="wood-btn success flex-1" data-i18n="btn_save">💾 Save</button>
      <button id="closeSettings" class="wood-btn danger flex-1" data-i18n="btn_close">❌ Cancel</button>
    </div>
  </div>
</div>

<script src="js/menu-ui.js"></script>
<script src="js/menu-auth.js"></script>
<script>
  const playBtn    = document.getElementById('playButton');
  const playOpts   = document.getElementById('playOptions');
  const settingsBtn= document.getElementById('settingsButton');
  const exitBtn    = document.getElementById('exitButton');
  const loginBtn   = document.getElementById('loginButton');
  const signupBtn  = document.getElementById('signupButton');
  const loginModal = document.getElementById('loginModal');
  const signupModal= document.getElementById('signupModal');
  const settModal  = document.getElementById('settingsModal');
  const cancelBtn  = document.getElementById('cancelLogin');
  const cancelSign = document.getElementById('cancelSignup');
  const closeSetBtn= document.getElementById('closeSettings');
  const xCloseSetBtn= document.getElementById('xCloseSettings');

  playBtn.addEventListener('click', () => {
    playOpts.classList.remove('hidden');
    playBtn.style.display = 'none';
    settingsBtn.style.display = 'none';
  });
  exitBtn.addEventListener('click', () => {
    playOpts.classList.add('hidden');
    playBtn.style.display = '';
    settingsBtn.style.display = '';
  });
  loginBtn.addEventListener('click', () => {
    loginModal.classList.add('show');
    playOpts.classList.add('hidden');
    playBtn.style.display = '';
    settingsBtn.style.display = '';
  });
  signupBtn.addEventListener('click', () => {
    signupModal.classList.add('show');
    playOpts.classList.add('hidden');
    playBtn.style.display = '';
    settingsBtn.style.display = '';
  });
  cancelBtn.addEventListener('click', () => loginModal.classList.remove('show'));
  cancelSign.addEventListener('click', () => signupModal.classList.remove('show'));
  settingsBtn.addEventListener('click', () => settModal.classList.add('show'));
  closeSetBtn.addEventListener('click', () => settModal.classList.remove('show'));
  if (xCloseSetBtn) xCloseSetBtn.addEventListener('click', () => settModal.classList.remove('show'));

  [loginModal, signupModal, settModal].forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
  });

  const loginSignupLink = document.getElementById('loginSignupLink');
  if (loginSignupLink) {
    loginSignupLink.addEventListener('click', (e) => {
      e.preventDefault();
      loginModal.classList.remove('show');
      signupModal.classList.add('show');
    });
  }
</script>
<script src="js/drag-scroll.js"></script>
</body>
</html>
