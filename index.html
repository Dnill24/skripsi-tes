<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Quest Adventure</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="locales.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'minecraft': ['"Press Start 2P"', 'monospace'],
            'comic': ['Comic Sans MS', 'Comic Neue', 'cursive', 'Segoe UI', 'sans-serif'],
          },
          colors: {
            'primary': '#7c3aed',
            'secondary': '#2563eb',
            'accent': '#f59e0b',
            'success': '#10b981',
            'danger': '#ef4444',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-retro min-h-screen w-full flex flex-col items-center justify-center text-slate-100 overflow-hidden p-4">
  <div class="w-full max-w-md animate-float">
    <div class="glass-panel p-8 rounded-2xl text-center relative overflow-hidden">
      <h1 class="text-3xl font-minecraft text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400 mb-8 drop-shadow-lg">Math Quest</h1>
      <div class="space-y-4">
        <button class="button-primary w-full text-lg py-4" id="playButton">Play</button>
        <div class="play-options hidden flex-col gap-3" id="playOptions">
          <button class="button-outlined w-full" id="guestButton">Guest Mode</button>
          <button class="button-outlined w-full" id="loginButton">Login</button>
          <button class="exit-button w-full" id="exitButton">Exit</button>
        </div>
        <button class="button-outlined w-full" id="settingsButton">Settings</button>
      </div>
    </div>

    <!-- Login Modal -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50" id="loginModal">
      <div class="glass-panel p-8 w-[90%] max-w-md rounded-2xl relative">
        <div class="bg-gradient-to-r from-yellow-400 to-orange-500 text-white px-4 py-2 rounded-t-lg text-center font-bold mb-4">Start Your Quest</div>
        <h2 class="text-2xl font-bold text-white mb-4 text-center">Join the team!</h2>
        <p class="text-gray-300 mb-6 text-center">Pick a hero name and jump into a colorful math adventure. The game learns what you like and makes questions just right.</p>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Hero name</label>
            <input id="usernameInput" type="text" placeholder="e.g. Star Turtle" autocomplete="username" class="w-full px-3 py-2 border border-slate-700 rounded-lg bg-slate-900 text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Secret code</label>
            <input id="passwordInput" type="password" placeholder="Type anything to start" autocomplete="current-password" class="w-full px-3 py-2 border border-slate-700 rounded-lg bg-slate-900 text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button id="loginSubmitButton" class="flex-1 big-button">Start Playing</button>
          <button id="cancelLogin" class="flex-1 ghost-button">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50" id="settingsModal">
      <div class="glass-panel p-8 w-[90%] max-w-md rounded-2xl relative">
        <h3 class="text-2xl font-bold text-white mb-6 text-center">Settings</h3>
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <label for="volumeSlider" class="text-sm font-medium text-gray-300">Volume</label>
            <div class="flex items-center gap-3">
              <input type="range" id="volumeSlider" min="0" max="100" value="50" class="w-24 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
              <span id="volumeValue" class="text-sm font-medium text-gray-300 min-w-[3rem]">50%</span>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <label for="languageSelect" class="text-sm font-medium text-gray-300">Language</label>
            <select id="languageSelect" class="px-3 py-2 border border-slate-700 rounded-lg bg-slate-900 text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
              <option value="en">English</option>
              <option value="id">Indonesian</option>
            </select>
          </div>
        </div>
        <div class="flex gap-3 mt-8">
          <button id="saveSettings" class="flex-1 big-button">Save</button>
          <button id="closeSettings" class="flex-1 ghost-button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="menu.js"></script>
</body>
</html>
