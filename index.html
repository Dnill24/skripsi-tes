<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Quest Adventure</title>
  <meta name="description" content="A math adventure game for elementary students!" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="locales.js"></script>
  <script>tailwind.config = { theme: { extend: {} } }</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }

    /* Title Signpost */
    .title-sign {
      background: var(--wood-bg);
      border: 6px solid var(--wood-border);
      box-shadow: var(--shadow-block), 0 12px 24px rgba(0,0,0,0.6);
      padding: 24px 32px;
      position: relative;
      text-align: center;
      transform: rotate(-2deg);
      animation: float 4s ease-in-out infinite;
      transition: transform 0.3s ease-out;
    }
    .title-sign:hover {
      transform: rotate(2deg) scale(1.05);
    }
    .title-sign::before, .title-sign::after {
      content: ''; position: absolute; top: 12px; width: 12px; height: 12px;
      background: #424242; border: 2px solid #212121; border-radius: 50%;
    }
    .title-sign::before { left: 12px; }
    .title-sign::after { right: 12px; }

    .title-sign h1 {
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      color: #fff;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.8);
      margin: 0; line-height: 1.4;
    }
    .title-sign p {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.5rem, 1.5vw, 0.75rem);
      color: var(--text-gold);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
      margin: 12px 0 0;
    }
  </style>
</head>
<body class="bg-hub">
<div style="display:flex; align-items:stretch; justify-content:flex-end; padding:clamp(16px,4vw,48px); height:100%;">

  <!-- Title Card (top-left) -->
  <div style="position:absolute; top:clamp(20px,8vh,64px); left:clamp(20px,6vw,64px); z-index:10;">
    <div class="title-sign">
      <h1>MATH QUEST</h1>
      <p>Sandbox Adventure</p>
    </div>
  </div>

  <!-- Menu Panel (bottom-right) -->
  <div style="position:absolute; bottom:clamp(16px,5vh,56px); right:clamp(16px,5vw,56px); z-index:20;">
    <div class="stone-panel" style="padding:24px 20px; min-width:260px; max-width:300px; width:88vw;">
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button id="playButton" class="wood-btn success">
          <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">⚔️</span><span data-i18n="menu_play">Play</span>
        </button>

        <!-- Play sub-options -->
        <div id="playOptions" style="display:none; flex-direction:column; gap:12px;">
          <button id="guestButton" class="wood-btn">
            <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">🧑‍🌾</span><span data-i18n="menu_guest">Guest Mode</span>
          </button>
          <button id="loginButton" class="wood-btn">
            <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">🔑</span><span data-i18n="menu_login">Login</span>
          </button>
          <button id="signupButton" class="wood-btn">
            <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">📝</span><span data-i18n="menu_signup">Sign Up</span>
          </button>
          <button id="exitButton" class="wood-btn danger">
            <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">🔙</span><span data-i18n="menu_back">Back</span>
          </button>
        </div>

        <button id="settingsButton" class="wood-btn">
          <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">⚙️</span><span data-i18n="menu_settings">Settings</span>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- Login Modal -->
<div class="terra-modal-overlay" id="loginModal">
  <div class="terra-modal-card">
    <h2 data-i18n="menu_login_title">WELCOME BACK</h2>
    <label for="usernameInput" data-i18n="menu_char_name">Character Name</label>
    <input id="usernameInput" type="text" placeholder="e.g. Hero" autocomplete="username" />
    <label for="passwordInput" data-i18n="menu_password">Password</label>
    <input id="passwordInput" type="password" placeholder="..." autocomplete="current-password" />
    <div style="display:flex; gap:12px; margin-top:20px;">
      <button id="loginSubmitButton" class="wood-btn success" style="flex:1;">
        <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">🚀</span><span data-i18n="menu_login">Login</span>
      </button>
      <button id="cancelLogin" class="wood-btn danger" style="flex:1;">
        <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">❌</span><span data-i18n="menu_cancel">Cancel</span>
      </button>
    </div>
  </div>
</div>

<!-- Signup Modal -->
<div class="terra-modal-overlay" id="signupModal">
  <div class="terra-modal-card">
    <h2 data-i18n="menu_join_server">CREATE ACCOUNT</h2>
    <label for="signupUsernameInput" data-i18n="menu_char_name">Character Name</label>
    <input id="signupUsernameInput" type="text" placeholder="e.g. Hero" autocomplete="username" />
    <label for="signupPasswordInput" data-i18n="menu_password">Password</label>
    <input id="signupPasswordInput" type="password" placeholder="..." autocomplete="new-password" />
    <div style="display:flex; gap:12px; margin-top:20px;">
      <button id="signupSubmitButton" class="wood-btn success" style="flex:1;">
        <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">✨</span><span data-i18n="menu_signup">Sign Up</span>
      </button>
      <button id="cancelSignup" class="wood-btn danger" style="flex:1;">
        <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">❌</span><span data-i18n="menu_cancel">Cancel</span>
      </button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="terra-modal-overlay" id="settingsModal">
  <div class="terra-modal-card">
    <h2 data-i18n="menu_settings">SETTINGS</h2>
    <div style="display:flex; flex-direction:column; gap:24px; margin-top:16px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <label for="volumeSlider" style="margin:0;">
          <span style="font-size:1.2rem; vertical-align:middle; margin-right:4px;">🔊</span><span data-i18n="lbl_volume">Volume</span>
        </label>
        <div style="display:flex; align-items:center; gap:12px;">
          <input type="range" id="volumeSlider" min="0" max="100" value="50" style="width:100px; accent-color:var(--text-gold); cursor:pointer;">
          <span id="volumeValue" style="font-family:'Press Start 2P',monospace; font-size:0.6rem; color:var(--text-gold); min-width:3rem;">50%</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <label for="languageSelect" style="margin:0;">
          <span style="font-size:1.2rem; vertical-align:middle; margin-right:4px;">🌐</span><span data-i18n="lbl_language">Language</span>
        </label>
        <select id="languageSelect" style="margin:0; width:140px;">
          <option value="en">English</option>
          <option value="id">Indonesian</option>
        </select>
      </div>
    </div>
    <div style="display:flex; gap:12px; margin-top:32px;">
      <button id="saveSettings" class="wood-btn success" style="flex:1;">
        <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">💾</span><span data-i18n="btn_save">Save</span>
      </button>
      <button id="closeSettings" class="wood-btn danger" style="flex:1;">
        <span style="font-size:1.2rem; vertical-align:middle; margin-right:8px;">❌</span><span data-i18n="menu_cancel">Cancel</span>
      </button>
    </div>
  </div>
</div>

<script src="menu.js"></script>
<script>
  const playBtn    = document.getElementById('playButton');
  const playOpts   = document.getElementById('playOptions');
  const settingsBtn= document.getElementById('settingsButton');
  const exitBtn    = document.getElementById('exitButton');
  const loginBtn   = document.getElementById('loginButton');
  const signupBtn  = document.getElementById('signupButton');
  const loginModal = document.getElementById('loginModal');
  const signupModal= document.getElementById('signupModal');
  const settModal  = document.getElementById('settingsModal');
  const cancelBtn  = document.getElementById('cancelLogin');
  const cancelSign = document.getElementById('cancelSignup');
  const closeSetBtn= document.getElementById('closeSettings');

  playBtn.addEventListener('click', () => {
    playOpts.style.display = 'flex';
    playBtn.style.display = 'none';
    settingsBtn.style.display = 'none';
  });
  exitBtn.addEventListener('click', () => {
    playOpts.style.display = 'none';
    playBtn.style.display = '';
    settingsBtn.style.display = '';
  });
  loginBtn.addEventListener('click', () => {
    loginModal.classList.add('show');
    playOpts.style.display = 'none';
    playBtn.style.display = '';
    settingsBtn.style.display = '';
  });
  signupBtn.addEventListener('click', () => {
    signupModal.classList.add('show');
    playOpts.style.display = 'none';
    playBtn.style.display = '';
    settingsBtn.style.display = '';
  });
  cancelBtn.addEventListener('click', () => loginModal.classList.remove('show'));
  cancelSign.addEventListener('click', () => signupModal.classList.remove('show'));
  settingsBtn.addEventListener('click', () => settModal.classList.add('show'));
  closeSetBtn.addEventListener('click', () => settModal.classList.remove('show'));

  [loginModal, signupModal, settModal].forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
  });
</script>
<script src="drag-scroll.js"></script>
</body>
</html>
