<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Quest Adventure - Hub</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="locales.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#0f172a', secondary: '#1e293b', accent: '#8b5cf6' } } } }
  </script>
</head>
<body class="bg-retro min-h-screen w-full flex flex-col items-center justify-center text-slate-100 p-4">
  <div class="w-full max-w-md animate-float">
    <div class="glass-panel p-8 rounded-2xl text-center relative overflow-hidden">
      <h1 class="text-3xl font-minecraft text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400 mb-2 drop-shadow-lg" data-i18n="title_hub">Game Hub</h1>
      <p class="text-slate-300 mb-8 font-semibold"><span data-i18n="welcome">Welcome back, Hero!</span> (<span id="playerNameDisplay" class="text-white">Hero</span>)</p>
      
      <div class="space-y-4 flex flex-col items-center">
        <button id="btnStartRun" class="big-button w-full" data-i18n="btn_start">Start Run</button>
        <button id="btnShop" class="button-outlined w-full" data-i18n="btn_shop">Skin Shop</button>
        <button id="btnAchievements" class="button-outlined w-full" data-i18n="btn_achievements">Achievements</button>
        <button id="btnLeaderboard" class="button-outlined w-full" data-i18n="btn_leaderboard">Leaderboard</button>
        <button id="btnVersus" class="button-outlined w-full" style="border-color: #ec4899; color: #ec4899;" data-i18n="btn_versus">Versus Mode</button>
        <button id="btnSettings" class="button-outlined w-full" data-i18n="btn_settings">Settings</button>
        <button id="btnBackToTitle" class="exit-button w-full mt-4" data-i18n="btn_logout">Logout</button>
      </div>
    </div>
  </div>

  <!-- Shop Modal -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50" id="shopModal">
    <div class="glass-panel p-8 w-[90%] max-w-2xl rounded-2xl relative max-h-[80vh] overflow-y-auto custom-scrollbar">
      <button id="xCloseShop" class="absolute top-4 right-6 text-slate-400 hover:text-white text-3xl font-bold">&times;</button>
      <h2 class="text-2xl font-minecraft text-white mb-2 text-center" data-i18n="modal_shop">Skin Shop</h2>
      <p class="text-center text-slate-300 mb-6"><span data-i18n="gold_label">Gold: </span><span id="shopGoldDisplay" class="text-yellow-400 font-bold">0</span></p>
      <div id="shopList" class="grid grid-cols-1 gap-4"></div>
      <button id="closeShopModal" class="button-outlined w-full mt-6" data-i18n="btn_close">Close</button>
    </div>
  </div>

  <!-- Achievements Modal -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50" id="achievementsModal">
    <div class="glass-panel p-8 w-[90%] max-w-2xl rounded-2xl relative max-h-[80vh] overflow-y-auto custom-scrollbar">
      <button id="xCloseAchievements" class="absolute top-4 right-6 text-slate-400 hover:text-white text-3xl font-bold">&times;</button>
      <h2 class="text-2xl font-minecraft text-white mb-6 text-center" data-i18n="modal_achievements">Achievements</h2>
      
      <h3 class="text-lg font-minecraft text-slate-300 mb-4" data-i18n="hdr_stats">Statistics</h3>
      <div class="grid grid-cols-2 gap-4 text-center mb-8">
        <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
          <h3 class="text-slate-400 text-sm" data-i18n="stat_best">Best Score</h3>
          <p id="statBestScore" class="text-2xl text-emerald-400 font-bold">0</p>
        </div>
        <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
          <h3 class="text-slate-400 text-sm" data-i18n="stat_gold">Total Gold</h3>
          <p id="statTotalGold" class="text-2xl text-yellow-400 font-bold">0</p>
        </div>
        <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
          <h3 class="text-slate-400 text-sm" data-i18n="stat_bosses">Bosses Defeated</h3>
          <p id="statBosses" class="text-2xl text-red-400 font-bold">0</p>
        </div>
        <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
          <h3 class="text-slate-400 text-sm" data-i18n="stat_runs">Total Runs</h3>
          <p id="statRuns" class="text-2xl text-blue-400 font-bold">0</p>
        </div>
      </div>

      <h3 class="text-lg font-minecraft text-slate-300 mb-4" data-i18n="hdr_goals">Goals</h3>
      <div id="achievementsList" class="flex flex-col gap-4"></div>

      <button id="closeAchievementsModal" class="button-outlined w-full mt-6" data-i18n="btn_close">Close</button>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50" id="leaderboardModal">
    <div class="glass-panel p-8 w-[90%] max-w-2xl rounded-2xl relative max-h-[80vh] overflow-y-auto custom-scrollbar">
      <button id="xCloseLeaderboard" class="absolute top-4 right-6 text-slate-400 hover:text-white text-3xl font-bold">&times;</button>
      <h2 class="text-2xl font-minecraft text-white mb-6 text-center" data-i18n="modal_leaderboard">Top Scores</h2>
      
      <div class="bg-slate-800/50 rounded-xl border border-slate-700 overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-900/50 text-slate-400 font-minecraft border-b border-slate-700">
            <tr>
              <th class="px-4 py-3 text-center w-16" data-i18n="col_rank">Rank</th>
              <th class="px-4 py-3" data-i18n="col_name">Hero</th>
              <th class="px-4 py-3 text-right" data-i18n="col_score">Score</th>
              <th class="px-4 py-3 text-right" data-i18n="col_date">Date</th>
            </tr>
          </thead>
          <tbody id="leaderboardList" class="divide-y divide-slate-700/50">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>

      <button id="closeLeaderboardModal" class="button-outlined w-full mt-6" data-i18n="btn_close">Close</button>
    </div>
  </div>

  <!-- Mode Selection Modal -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50" id="modeModal">
    <div class="glass-panel p-8 w-[90%] max-w-md rounded-2xl relative text-center">
      <button id="xCloseMode" class="absolute top-4 right-6 text-slate-400 hover:text-white text-3xl font-bold">&times;</button>
      <h2 class="text-2xl font-minecraft text-white mb-6" data-i18n="modal_mode">Select Mode</h2>
      <div class="space-y-3">
        <button class="big-button w-full btn-mode" data-mode="normal" data-i18n="btn_normal">Normal Run</button>
        <div class="text-slate-400 text-sm mt-4 mb-2">- Practice Modes (0.2x Rewards) -</div>
        <button class="button-outlined w-full btn-mode" data-mode="+" data-i18n="btn_add">Practice Addition (+)</button>
        <button class="button-outlined w-full btn-mode" data-mode="-" data-i18n="btn_sub">Practice Subtraction (-)</button>
        <button class="button-outlined w-full btn-mode" data-mode="*" data-i18n="btn_mul">Practice Multiplication (×)</button>
        <button class="button-outlined w-full btn-mode" data-mode="/" data-i18n="btn_div">Practice Division (÷)</button>
      </div>
      <button id="closeModeModal" class="ghost-button w-full mt-6" data-i18n="btn_close">Cancel</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50" id="settingsModal">
    <div class="glass-panel p-8 w-[90%] max-w-md rounded-2xl relative">
      <button id="xCloseSettings" class="absolute top-4 right-6 text-slate-400 hover:text-white text-3xl font-bold">&times;</button>
      <h3 class="text-2xl font-minecraft text-white mb-6 text-center" data-i18n="modal_settings">Settings</h3>
      <div class="space-y-6">
        <div class="flex items-center justify-between">
          <label for="volumeSlider" class="text-sm font-medium text-gray-300" data-i18n="lbl_volume">Volume</label>
          <div class="flex items-center gap-3">
            <input type="range" id="volumeSlider" min="0" max="100" value="50" class="w-24 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            <span id="volumeValue" class="text-sm font-medium text-gray-300 min-w-[3rem]">50%</span>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <label for="languageSelect" class="text-sm font-medium text-gray-300" data-i18n="lbl_language">Language</label>
          <select id="languageSelect" class="px-3 py-2 border border-slate-700 rounded-lg bg-slate-900 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
            <option value="en">English</option>
            <option value="id">Indonesian</option>
          </select>
        </div>
      </div>
      <div class="flex gap-3 mt-8">
        <button id="saveSettings" class="big-button flex-1" data-i18n="btn_save">Save</button>
        <button id="closeSettings" class="ghost-button flex-1" data-i18n="btn_close">Cancel</button>
      </div>
    </div>
  </div>

  <script src="hub.js"></script>
</body>
</html>
