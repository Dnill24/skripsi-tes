<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Quest Adventure - Hub</title>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      if (msg === "Script error.") return;
      alert("CRASH: " + msg + "\nLine: " + line + "\nURL: " + url + "\n" + (error ? error.stack : ""));
    };
    window.addEventListener("unhandledrejection", function(e) {
      alert("PROMISE CRASH: " + e.reason);
    });
  </script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="locales.js"></script>
  <script src="sfx.js"></script>
  <script>tailwind.config = { theme: { extend: {} } }</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; padding: 0; overflow-x: hidden; overflow-y: auto; }

    /* Title Signpost */
    .title-sign {
      background: var(--wood-bg); border: 6px solid var(--wood-border);
      box-shadow: var(--shadow-block), 0 12px 24px rgba(0,0,0,0.6);
      padding: 16px 20px; position: relative; text-align: center;
      /* Removed rotation and float animation so it aligns perfectly with the panel below */
    }
    .title-sign::before, .title-sign::after {
      content: ''; position: absolute; top: 8px; width: 10px; height: 10px;
      background: #424242; border: 2px solid #212121; border-radius: 50%;
    }
    .title-sign::before { left: 10px; }
    .title-sign::after { right: 10px; }
    .title-sign h1 {
      font-family: 'Press Start 2P', monospace; font-size: clamp(0.9rem, 2.5vw, 1.5rem);
      color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.8); margin: 0; line-height: 1.4;
    }
    .title-sign p {
      font-family: 'Comic Neue', cursive; font-weight: 700; font-size: 1rem;
      color: #4e342e; margin: 8px 0 0; text-shadow: none;
    }
    .title-sign span { color: #ffb300; text-shadow: 1px 1px 0 rgba(0,0,0,0.5); }

    /* Close X button */
    .modal-close-btn {
      background: none; border: none; cursor: pointer;
      font-size: 1.2rem; color: var(--text-dim); transition: color 0.15s steps(2);
      text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
      font-family: 'Press Start 2P', monospace;
    }
    .modal-close-btn:hover { color: #ef5350; }

    /* Mobile Text Scaling */
    @media (max-width: 640px) {
      .title-sign h1 { font-size: clamp(0.45rem, 3vw, 1.5rem) !important; }
      .title-sign p { font-size: 0.5rem !important; }
      #playerMMRDisplay { font-size: 0.3rem !important; }
      .title-sign p[style*="0.6rem"] { font-size: 0.3rem !important; }
      #btnToggleQuests { font-size: 0.45rem !important; }
      #questsToggleIcon { font-size: 0.4rem !important; }
      #dailyQuestTimer { font-size: 0.35rem !important; }
    }
  </style>
</head>
<body class="bg-hub">
<div style="display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; padding:clamp(16px,4vw,48px); min-height:100vh; gap:40px; margin: 0 auto; width: 100%; max-width: 1400px;">

  <!-- Left Column: Title and Missions -->
  <div class="hub-left-column" style="display:flex; flex-direction:column; align-items:stretch; width:100%; max-width:340px; min-width:280px; box-sizing:border-box;">
    <!-- Title Card -->
    <div class="hub-title-container" style="text-align:center; z-index: 2;">
      <div class="title-sign" style="width:100%; box-sizing:border-box; border-bottom: none; border-radius: 4px 4px 0 0;">
        <h1 data-i18n="title_hub">Base Camp</h1>
        <p data-i18n="welcome">Welcome back, <span id="playerNameDisplay">Hero</span>!</p>
        <p style="font-family: 'Press Start 2P', monospace; font-size: 0.6rem; color: #64b5f6; margin-top: 4px; text-shadow: 1px 1px 0 rgba(0,0,0,0.8);">Rank: <span id="playerMMRDisplay">10</span></p>
      </div>
    </div>
    
    <!-- Daily Missions Panel -->
    <div class="stone-panel quests-panel" style="padding:12px; width:100%; box-sizing:border-box; overflow:hidden; border-top: none !important; border-radius: 0 0 4px 4px !important; transition: all 0.3s ease;">
      <h2 id="btnToggleQuests" class="fancy-header" style="margin:0; font-size:0.9rem; text-align:center; cursor:pointer; display:flex; justify-content:space-between; align-items:center; user-select:none;">
        <span data-i18n="modal_quests">📜 Daily Mission</span>
        <span id="questsToggleIcon" style="font-size:0.8rem; transition:transform 0.2s; color:#ffb300;">▼</span>
      </h2>
      <div id="dailyQuestTimer" style="text-align:center; font-size:0.75rem; color:#888; margin-top:4px; font-family: 'Press Start 2P', monospace;"></div>
      <div id="questsListContainer" style="display:none; margin-top:12px; animation: pop 0.2s ease-out;">
        <div id="questsList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </div>
  </div>

  <!-- Right Column: Hub Panel -->
  <div class="hub-panel-container">
    <div class="stone-panel" style="padding:16px 14px; min-width:280px; max-width:360px; width:90vw;">
      <div class="hub-btn-grid">
        <button id="btnStartRun" class="wood-btn success btn-full" data-i18n="btn_start">⚔️ Enter Cave</button>
        <button id="btnShop"         class="wood-btn" data-i18n="btn_shop">🛒 Skins</button>
        <button id="btnUpgrades"     class="wood-btn" data-i18n="btn_upgrades">⚒️ Upgrades</button>
        <button id="btnAchievements" class="wood-btn" data-i18n="btn_achievements">🏆 Trophies</button>
        <button id="btnBuffIndex"    class="wood-btn" data-i18n="btn_buff_index">📖 Buff Index</button>
        <button id="btnLeaderboard"  class="wood-btn" data-i18n="btn_leaderboard">📊 Rankings</button>
        <button id="btnVersus"       class="wood-btn" style="background:#5e35b1; border-color:#311b92; box-shadow:inset -3px -3px 0 rgba(0,0,0,0.3), inset 3px 3px 0 rgba(255,255,255,0.2), 0 4px 0 #311b92;" data-i18n="btn_versus">⚡ Versus</button>
        <button id="btnSettings"     class="wood-btn" data-i18n="btn_settings">⚙️ Settings</button>
        <button id="btnBackToTitle"  class="wood-btn danger" data-i18n="btn_logout">🚪 Logout</button>
      </div>
    </div>
  </div>
</div>

<div id="modalsContainer">

<!-- ── SHOP MODAL ─────────────────────────────────────── -->
<div class="terra-modal-overlay" id="shopModal">
  <div class="terra-modal-card" style="max-width:640px;">
    <button id="xCloseShop" class="modal-close-btn" style="position:sticky; top:0; float:right; z-index:20; background:var(--panel-bg); padding:4px 8px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.5);">X</button>
    <div style="margin-bottom:16px;">
      <h2 class="fancy-header" style="margin:0;" data-i18n="modal_shop">🛒 Skins</h2>
    </div>
    <p style="text-align:center; font-size:1.1rem; margin-bottom:20px;">
      <span data-i18n="gold_label" style="font-family:'Press Start 2P',monospace; font-size:0.6rem;">Coins: </span>
      <span id="shopGoldDisplay" style="font-family:'Press Start 2P',monospace; font-size:0.8rem; color:var(--text-gold); text-shadow:2px 2px 0 rgba(0,0,0,0.8);">0</span>
      <span style="margin-left:4px;">🪙</span>
    </p>
    <div id="shopList" style="display:flex; flex-direction:row; gap:12px; overflow-x:auto; padding-bottom:16px; scroll-snap-type:x mandatory;"></div>
    <button id="closeShopModal" class="wood-btn" style="margin-top:16px; width:100%;" data-i18n="btn_close">Close</button>
  </div>
</div>

<!-- ── UPGRADES MODAL ─────────────────────────────────── -->
<div class="terra-modal-overlay" id="upgradesModal">
  <div class="terra-modal-card" style="max-width:540px;">
    <button id="xCloseUpgrades" class="modal-close-btn" style="position:sticky; top:0; float:right; z-index:20; background:var(--panel-bg); padding:4px 8px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.5);">X</button>
    <div style="margin-bottom:16px;">
      <h2 class="fancy-header" style="margin:0;" data-i18n="modal_upgrades">⚒️ Upgrades</h2>
    </div>
    <p style="text-align:center; font-size:1.1rem; margin-bottom:20px;">
      <span data-i18n="gold_label" style="font-family:'Press Start 2P',monospace; font-size:0.6rem;">Coins: </span>
      <span id="upgradesGoldDisplay" style="font-family:'Press Start 2P',monospace; font-size:0.8rem; color:var(--text-gold); text-shadow:2px 2px 0 rgba(0,0,0,0.8);">0</span>
      <span style="margin-left:4px;">🪙</span>
    </p>
    <div id="upgradesList" style="display:flex; flex-direction:column; gap:12px; padding-bottom:16px;"></div>
    <button id="closeUpgradesModal" class="wood-btn" style="margin-top:16px; width:100%;" data-i18n="btn_close">Close</button>
  </div>
</div>

<!-- ── ACHIEVEMENTS MODAL ─────────────────────────────── -->
<div class="terra-modal-overlay" id="achievementsModal">
  <div class="terra-modal-card" style="max-width:560px;">
    <button id="xCloseAchievements" class="modal-close-btn" style="position:sticky; top:0; float:right; z-index:20; background:var(--panel-bg); padding:4px 8px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.5);">X</button>
    <div style="margin-bottom:16px;">
      <h2 class="fancy-header" style="margin:0;" data-i18n="modal_achievements">🏆 Trophies</h2>
    </div>
    <div class="terra-divider">STATS</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;">
      <div class="stone-chip"><span class="value" id="statBestScore" style="color:#69f0ae;">0</span><span class="label" data-i18n="stat_best">Best Score</span></div>
      <div class="stone-chip"><span class="value" id="statTotalGold" style="color:var(--text-gold);">0</span><span class="label" data-i18n="stat_gold">Total Coins</span></div>
      <div class="stone-chip"><span class="value" id="statBosses"    style="color:#ff5252;">0</span><span class="label" data-i18n="stat_bosses">Bosses</span></div>
      <div class="stone-chip"><span class="value" id="statRuns"      style="color:#40c4ff;">0</span><span class="label" data-i18n="stat_runs">Total Runs</span></div>
    </div>
    <div class="terra-divider">GOALS</div>
    <div id="achievementsList" style="display:flex; flex-direction:column; gap:12px; padding-bottom:24px;"></div>
  </div>
</div>

<!-- ── BUFF INDEX MODAL ─────────────────────────────── -->
<div class="terra-modal-overlay" id="buffIndexModal">
  <div class="terra-modal-card" style="max-width:600px; width:95%; max-height:85vh; overflow-y:auto;">
    <button id="xCloseBuffIndex" class="modal-close-btn" style="position:sticky; top:0; float:right; z-index:20; background:var(--panel-bg); padding:4px 8px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.5);">X</button>
    <div style="margin-bottom:16px;">
      <h2 class="fancy-header" style="margin:0;" data-i18n="title_buff_index">Buff Index</h2>
    </div>
    <div id="buffIndexList" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:16px; margin-top: 16px;"></div>
  </div>
</div>

<!-- ── LEADERBOARD MODAL ───────────────────────────────── -->
<div class="terra-modal-overlay" id="leaderboardModal">
  <div class="terra-modal-card" style="max-width:540px;">
    <button id="xCloseLeaderboard" class="modal-close-btn" style="position:sticky; top:0; float:right; z-index:20; background:var(--panel-bg); padding:4px 8px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.5);">X</button>
    <div style="margin-bottom:16px;">
      <h2 class="fancy-header" style="margin:0;" data-i18n="modal_leaderboard">📊 Top Heroes</h2>
    </div>
    <div style="background:#263238; border:4px solid var(--panel-border); box-shadow:inset 2px 2px 0 rgba(0,0,0,0.5); max-height:55vh; overflow-y:auto;">
      <table style="width:100%; border-collapse:collapse;">
        <thead style="background:#37474f; position:sticky; top:0; z-index:1; border-bottom:4px solid var(--panel-border);">
          <tr>
            <th style="font-family:'Press Start 2P',monospace; font-size:0.55rem; color:var(--text-gold); padding:12px; text-shadow:1px 1px 0 rgba(0,0,0,0.8); text-align:center;" data-i18n="col_rank">Rank</th>
            <th style="font-family:'Press Start 2P',monospace; font-size:0.55rem; color:var(--text-gold); padding:12px; text-shadow:1px 1px 0 rgba(0,0,0,0.8);" data-i18n="col_name">Hero</th>
            <th style="font-family:'Press Start 2P',monospace; font-size:0.55rem; color:#64b5f6; padding:12px; text-shadow:1px 1px 0 rgba(0,0,0,0.8); text-align:right;">Rank</th>
            <th style="font-family:'Press Start 2P',monospace; font-size:0.55rem; color:var(--text-gold); padding:12px; text-shadow:1px 1px 0 rgba(0,0,0,0.8); text-align:right;" data-i18n="col_score">Score</th>
            <th style="font-family:'Press Start 2P',monospace; font-size:0.55rem; color:var(--text-gold); padding:12px; text-shadow:1px 1px 0 rgba(0,0,0,0.8); text-align:right;" data-i18n="col_date">Date</th>
          </tr>
        </thead>
        <tbody id="leaderboardList"></tbody>
      </table>
    </div>
    <button id="closeLeaderboardModal" class="wood-btn" style="margin-top:20px; width:100%;" data-i18n="btn_close">Close</button>
  </div>
</div>

<!-- ── MODE MODAL ──────────────────────────────────────── -->
<div class="terra-modal-overlay" id="modeModal">
  <div class="terra-modal-card" style="max-width:440px; text-align:center;">
    <button id="xCloseMode" class="modal-close-btn" style="position:absolute; top:12px; right:12px; z-index:20; background:var(--panel-bg); padding:4px 8px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.5);">X</button>
    <div style="margin-bottom:24px; margin-top:12px;">
      <h2 class="fancy-header" style="margin:0;" data-i18n="modal_mode">⚔️ Select Mode</h2>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <button class="wood-btn success btn-mode" data-mode="normal" data-i18n="btn_normal">⚔️ Deep Cave (Normal)</button>
      <div class="terra-divider" data-i18n="lbl_practice_mode">Practice (0.2x Coins)</div>
      <button class="wood-btn btn-mode" data-mode="+" data-i18n="btn_add">➕ Addition</button>
      <button class="wood-btn btn-mode" data-mode="-" data-i18n="btn_sub">➖ Subtraction</button>
      <button class="wood-btn btn-mode" data-mode="*" data-i18n="btn_mul">✖️ Multiplication</button>
      <button class="wood-btn btn-mode" data-mode="/" data-i18n="btn_div">➗ Division</button>
    </div>
    <button id="closeModeModal" class="wood-btn danger" style="margin-top:24px; width:100%;" data-i18n="btn_close">Cancel</button>
  </div>
</div>

<!-- ── SETTINGS MODAL ─────────────────────────────────── -->
<div class="terra-modal-overlay" id="settingsModal">
  <div class="terra-modal-card" style="max-width:440px;">
    <button id="xCloseSettings" class="modal-close-btn" style="position:absolute; top:12px; right:12px; z-index:20; background:var(--panel-bg); padding:4px 8px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.5);">X</button>
    <div style="margin-bottom:24px; margin-top:12px;">
      <h2 class="fancy-header" style="margin:0;" data-i18n="modal_settings">⚙️ Settings</h2>
    </div>
    <div style="display:flex; flex-direction:column; gap:24px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <label for="musicVolumeSlider" style="margin:0;"><span style="font-size:1.2rem; vertical-align:middle; margin-right:4px;">🎵</span> <span data-i18n="lbl_music_volume">Music</span></label>
        <div style="display:flex; align-items:center; gap:12px;">
          <input type="range" id="musicVolumeSlider" min="0" max="100" value="50" style="width:100px; padding:0; height:12px; border:none; accent-color:var(--text-gold); cursor:pointer; box-shadow:none;">
          <span id="musicVolumeValue" style="font-family:'Press Start 2P',monospace; font-size:0.6rem; color:var(--text-gold); min-width:3rem; text-shadow:1px 1px 0 rgba(0,0,0,0.8);">50%</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <label for="sfxVolumeSlider" style="margin:0;"><span style="font-size:1.2rem; vertical-align:middle; margin-right:4px;">🔊</span> <span data-i18n="lbl_sfx_volume">SFX</span></label>
        <div style="display:flex; align-items:center; gap:12px;">
          <input type="range" id="sfxVolumeSlider" min="0" max="100" value="70" style="width:100px; padding:0; height:12px; border:none; accent-color:var(--text-gold); cursor:pointer; box-shadow:none;">
          <span id="sfxVolumeValue" style="font-family:'Press Start 2P',monospace; font-size:0.6rem; color:var(--text-gold); min-width:3rem; text-shadow:1px 1px 0 rgba(0,0,0,0.8);">70%</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <label for="languageSelect" style="margin:0;">🌐 <span data-i18n="lbl_language">Language</span></label>
        <select id="languageSelect" style="margin:0; width:180px; padding:8px;">
          <option value="en">English</option>
          <option value="id">Bahasa Indonesia</option>
        </select>
      </div>
      <button id="btnReplayTutorial" class="wood-btn" style="width:100%; margin-top:8px;" data-i18n="btn_replay_tutorial">🔄 Replay Tutorial</button>
    </div>
    <div style="display:flex; gap:12px; margin-top:32px;">
      <button id="saveSettings"  class="wood-btn success" style="flex:1;" data-i18n="btn_save">💾 Save</button>
      <button id="closeSettings" class="wood-btn danger"  style="flex:1;" data-i18n="btn_close">❌ Cancel</button>
    </div>
  </div>
</div>

</div><!-- /modalsContainer -->

<script src="tutorial.js"></script>
<script src="hub.js"></script>
<script>
  // Backdrop click to close
  document.querySelectorAll('.terra-modal-overlay').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('show'); });
  });
</script>
<script src="drag-scroll.js"></script>
</body>
</html>
