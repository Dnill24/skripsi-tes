<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathQuest: Rogue - Play</title>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      if (msg === "Script error.") return;
      alert("CRASH: " + msg + "\nLine: " + line + "\nURL: " + url + "\n" + (error ? error.stack : ""));
    };
    window.addEventListener("unhandledrejection", function(e) {
      alert("PROMISE CRASH: " + e.reason);
    });
  </script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script>window.onerror = function(msg, url, line) { 
    var el = document.getElementById('lblQuestion'); 
    if (el) el.textContent = msg + ' at line ' + line; 
  };</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>tailwind.config = { theme: { extend: {} } }</script>

</head>
<body class="bg-cave play-layout">

  <!-- ── TOP HEADER ─────────────────────────────────── -->
  <header id="gameHeader">
    <div id="hudTop" class="stone-panel hud-top">
      <div class="hud-top-row">
        <!-- Pause -->
        <button id="btnPause" class="wood-btn btn-pause" data-i18n="btn_pause">⏸️ Pause</button>
        <!-- Stage + Score + Gold -->
        <div class="hud-center">
          <div class="hud-stats-row">
            <div>
              <span class="hud-label hud-label-white" data-i18n="lbl_run">Stage</span>
              <span class="hud-value" id="lblRunStage">1</span>
            </div>
            <div class="hud-divider"></div>
            <div>
              <span class="hud-label hud-label-white" data-i18n="lbl_score">Score</span>
              <span class="hud-value" id="lblScore">0</span>
            </div>
            <div class="hud-divider"></div>
            <div>
              <span class="hud-label hud-label-white" data-i18n="gold_label">Gold: </span>
              <span class="hud-value text-yellow-500" id="lblRunGold">0</span>
            </div>
          </div>
          
          <!-- Active Buffs -->
          <div id="activeBuffsContainer" class="active-buffs"></div>
        </div>

        <!-- HP -->
        <div class="hud-hp-container">
          <span class="hud-label hud-label-white" data-i18n="lbl_hp">HP</span>
          <span class="hud-value green" id="lblHealth">100/100</span>
        </div>
      </div>
    </div>

    <!-- Progress bars row -->
    <div class="hud-progress-container">
      <!-- Stage progress -->
      <div class="hud-progress-row">
        <span class="hud-label text-blue-400 mb-0.5" data-i18n="lbl_stage_progress">STAGE PROGRESS</span>
      </div>
      <div class="bar-track h-[clamp(14px,3vw,20px)]">
        <div id="barProgress" class="bar-fill bar-fill-prog w-0 h-full"></div>
      </div>
      <!-- Boss HP -->
      <div id="bossHpContainer" class="hidden">
        <div class="hud-progress-row">
          <span class="hud-label text-red-500 mb-0.5 animate-pulse-glow" data-i18n="lbl_boss_hp">BOSS HP</span>
        </div>
        <div class="bar-track h-[clamp(14px,3vw,20px)]">
          <div id="barBossHp" class="bar-fill bar-fill-boss w-full h-full"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ── BATTLE ARENA ───────────────────────────────── -->
  <main id="gameArenaWrapper">

    <div id="arenaFloor" class="arena-floor"></div>

    <!-- Countdown Overlay -->
    <div id="countdownOverlay" class="countdown-overlay">
      <div id="countdownText" class="font-minecraft countdown-text">
        3
      </div>
    </div>

    <!-- Damage overlays -->
    <div id="damageFlash" class="damage-flash"></div>
    
    <!-- Combat Text -->
    <div id="combatText" class="combat-text-container"></div>
    
    <span id="lblCombo" class="absolute top-12 left-1/2 -translate-x-1/2 font-minecraft font-bold text-yellow-300 text-xl md:text-3xl drop-shadow-[2px_2px_0_#000] hidden whitespace-nowrap z-50 transition-transform duration-200"></span>
    
    <!-- Calculation Animation Overlay -->
    <div id="calcAnimContainer" class="hidden calc-anim-overlay">
      <div id="calcAnimContent" class="calc-anim-content"></div>
    </div>
    
    <!-- Arena Canvas -->
    <div id="arenaContent" class="arena-content">
      <!-- Hero -->
      <div id="playerSpriteContainer" class="sprite-container-left">
        <div id="playerSprite" class="player-sprite">
          🧍
        </div>
      </div>
      <!-- Enemy -->
      <div id="enemyContainer" class="sprite-container-right">
        <div id="enemySprite" class="enemy-sprite">
          🦇
        </div>
        <!-- Attack intent indicator -->
        <div id="attackIntent" class="attack-intent">
          ⚠️
        </div>
      </div>
    </div>
  </main>

  <!-- ── FOOTER UI ──────────────────────────────────── -->
  <footer id="questionFooter">
    <div id="lblQuestion" class="font-minecraft text-white text-center mb-4 text-2xl drop-shadow-md">
      Get Ready!
    </div>
    
    <div id="timerContainer" class="mb-4">
      <div class="bar-track h-3 bg-[#4e342e]">
        <div id="barTimer" class="bar-fill w-full h-3 bg-yellow-500 transition-[width] duration-100 ease-linear"></div>
      </div>
    </div>

    <div id="answerGrid">
      <button class="wood-btn btn-answer" id="btnAns0"></button>
      <button class="wood-btn btn-answer" id="btnAns1"></button>
      <button class="wood-btn btn-answer" id="btnAns2"></button>
      <button class="wood-btn btn-answer" id="btnAns3"></button>
    </div>
  </footer>

  <!-- ── RUN OVER MODAL ──────────────────────────────── -->
  <div class="terra-modal-overlay" id="runOverModal">
    <div class="terra-modal-card">
    <div class="mb-4">
      <h2 class="fancy-header" data-i18n="modal_run_over">Game Over</h2>
    </div>
      <p id="runOverMessage" class="font-[Comic_Neue] font-bold text-[1.1rem] text-[#b0bec5] mb-6 text-center" data-i18n="msg_bravely">You fought bravely.</p>
      
      <div class="run-over-grid">
        <div class="text-center">
          <span class="hud-label text-[0.5rem]" data-i18n="lbl_score">Score</span>
          <span class="hud-value text-[1.2rem]" id="finalScore">0</span>
        </div>
        <div class="text-center">
          <span class="hud-label text-[0.5rem]" data-i18n="gold_label">Gold</span>
          <span class="hud-value text-[1.2rem] text-yellow-400" id="finalGold">0</span>
        </div>
        <div class="text-center">
          <span class="hud-label text-[0.5rem]" data-i18n="lbl_stages">Stages</span>
          <span class="hud-value text-[1.2rem]" id="finalStages">0</span>
        </div>
        <div class="text-center">
          <span class="hud-label text-[0.5rem] text-green-400" data-i18n="lbl_correct">Correct</span>
          <span class="hud-value text-[1.2rem] text-green-400" id="finalCorrect">0</span>
        </div>
        <div class="text-center">
          <span class="hud-label text-[0.5rem] text-red-400" data-i18n="lbl_wrong">Wrong</span>
          <span class="hud-value text-[1.2rem] text-red-400" id="finalWrong">0</span>
        </div>
        <div class="text-center">
          <span class="hud-label text-[0.5rem] text-blue-400" data-i18n="lbl_total_questions">Total Questions</span>
          <span class="hud-value text-[1.2rem] text-blue-400" id="finalCombo">0</span>
        </div>
      </div>

      <div id="recommendationBox" class="hidden mb-6 text-center bg-white/10 p-3 rounded-lg border-2 border-yellow-500">
        <p class="text-yellow-500 text-[0.6rem] font-minecraft mb-2" data-i18n="lbl_recommendation">Recommendation</p>
        <p class="text-white text-[1.1rem] font-[Comic_Neue] mb-3 font-bold"><span data-i18n="lbl_practice_prefix">Practice</span> <span id="recSubject" class="text-yellow-500"></span>!</p>
        <button id="btnPracticeRec" class="wood-btn px-3 py-1.5 text-[0.6rem] mx-auto" data-i18n="btn_practice">Start Practice</button>
      </div>

      <button id="btnReturnHub" class="wood-btn w-full" data-i18n="btn_return_hub">Return to Camp</button>
    </div>
  </div>

  <!-- ── REWARD MODAL ────────────────────────────────── -->
  <div class="terra-modal-overlay" id="rewardModal">
    <div class="terra-modal-card max-w-[560px]">
    <div class="mb-4">
      <h2 class="fancy-header" data-i18n="modal_reward">BOSS DEFEATED!</h2>
    </div>
      <p class="font-minecraft text-[0.6rem] text-gray-400 text-center mb-6 drop-shadow-[1px_1px_0_rgba(0,0,0,0.8)]" data-i18n="msg_reward">Choose your loot...</p>
      
      <div id="rewardCardsContainer" class="grid grid-cols-[repeat(auto-fit,minmax(140px,1fr))] gap-4"></div>
    </div>
  </div>

  <!-- ── PAUSE MODAL ─────────────────────────────────── -->
  <div class="terra-modal-overlay" id="pauseModal">
    <div class="terra-modal-card">
      <div class="mb-4">
        <h2 class="fancy-header" data-i18n="txt_paused">PAUSED</h2>
      </div>
      
      <div class="flex flex-col gap-6 mb-8">
        <div class="settings-row">
          <label for="musicVolumeSlider"><span class="btn-icon">🎵</span> <span data-i18n="lbl_music_volume">Music</span></label>
          <div class="settings-slider-container">
            <input type="range" id="musicVolumeSlider" min="0" max="100" value="50" class="settings-slider">
            <span id="musicVolumeValue" class="settings-value">50%</span>
          </div>
        </div>
        <div class="settings-row">
          <label for="sfxVolumeSlider"><span class="btn-icon">🔊</span> <span data-i18n="lbl_sfx_volume">SFX</span></label>
          <div class="settings-slider-container">
            <input type="range" id="sfxVolumeSlider" min="0" max="100" value="70" class="settings-slider">
            <span id="sfxVolumeValue" class="settings-value">70%</span>
          </div>
        </div>
      </div>
      
      <div class="flex-row-gap-12">
        <button id="btnResumePause" class="wood-btn success flex-1" data-i18n="btn_resume">Resume</button>
        <button id="btnQuitPause" class="wood-btn danger flex-1" data-i18n="btn_return_hub">Return to Camp</button>
      </div>
    </div>
  </div>

<script src="js/locales.js"></script>
<script src="js/sfx.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/state.js"></script>
<script src="js/mmr.js"></script>
<script src="js/question.js"></script>
<script src="js/animations.js"></script>
<script src="js/combat.js"></script>
<script src="js/rewards.js"></script>
<script src="js/cutscenes.js"></script>
<script src="js/ui.js"></script>
<script src="js/play.js"></script>
</body>
</html>
