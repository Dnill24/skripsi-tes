<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Quest Adventure - Play</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script>window.onerror = function(msg, url, line) { 
    var el = document.getElementById('lblQuestion'); 
    if (el) el.textContent = msg + ' at line ' + line; 
  };</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>tailwind.config = { theme: { extend: {} } }</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }

    /* ── HEADER (STONE BAR) ── */
    #gameHeader {
      background: var(--panel-bg);
      border-bottom: 4px solid var(--panel-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      flex-shrink: 0;
      padding: 10px 16px;
      position: relative; z-index: 10;
      max-height: 38vh;
      overflow: hidden;
    }
    #gameHeader::before {
      content: ''; position: absolute; top:0; left:0; right:0; bottom:0;
      border-bottom: 2px solid rgba(255,255,255,0.1); pointer-events: none;
    }

    /* ── ARENA ── */
    #gameArenaWrapper {
      flex: 1; min-height: 0;
      position: relative; overflow: hidden; z-index: 20;
    }
    /* Darken overlay for deep cave */
    #gameArenaWrapper::before {
      content: ''; position: absolute; inset:0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
      pointer-events: none; z-index: 5;
    }

    /* ── FOOTER (STONE BAR) ── */
    #questionFooter {
      background: var(--panel-bg);
      border-top: 4px solid var(--panel-border);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.6);
      flex-shrink: 0;
      padding: 12px 16px 16px;
      position: relative; z-index: 10;
    }
    #questionFooter::before {
      content: ''; position: absolute; top:0; left:0; right:0; bottom:0;
      border-top: 2px solid rgba(255,255,255,0.1); pointer-events: none;
    }

    /* ── QUESTION TEXT ── */
    #lblQuestion {
      font-family: 'Press Start 2P', monospace !important;
      font-size: clamp(1.2rem, 5vw, 2.2rem) !important;
      font-weight: 700;
      color: #fff;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.8), 0 0 10px rgba(255,255,255,0.5);
      text-align: center;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    /* ── ANSWER GRID ── */
    #answerGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── HUD ELEMENTS ── */
    .hud-label {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.35rem, 1.5vw, 0.55rem);
      color: var(--text-dim);
      display: block;
      margin-bottom: 4px;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
    }
    .hud-value {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.5rem, 2vw, 0.9rem);
      color: var(--text-gold);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
    }
    .hud-value.green { color: #69f0ae; }
    .hud-value.red   { color: #ff5252; }

    /* ── COMBAT ARENA FLOOR ── */
    .arena-floor {
      position: absolute; bottom: -20px; left: -5%; width: 110%; height: 60px;
      background: var(--terra-stone);
      border-top: 4px solid var(--panel-border);
      box-shadow: inset 0 8px 0 rgba(0,0,0,0.3);
      z-index: 1;
      transform: perspective(200px) rotateX(10deg);
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-out;
    }
    .floor-hidden {
      transform: perspective(200px) rotateX(10deg) translateY(150px) !important;
      opacity: 0;
    }
    /* ── HUD ANIMATIONS ── */
    #gameHeader, #questionFooter {
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-out;
    }
    .hud-hidden-top {
      transform: translateY(-120%);
      opacity: 0;
      pointer-events: none;
    }
    .hud-hidden-bottom {
      transform: translateY(120%);
      opacity: 0;
      pointer-events: none;
    }
    #playerSpriteContainer, #enemyContainer {
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-out;
    }
    .char-hidden-left {
      transform: translateX(-200%);
      opacity: 0;
    }
    .char-hidden-right {
      transform: translateX(200%);
      opacity: 0;
    }
  </style>
</head>
<body class="bg-cave" style="display:flex; flex-direction:column; height:100%; overflow:hidden;">

  <!-- ── TOP HEADER ─────────────────────────────────── -->
  <header id="gameHeader">
    <div id="hudTop" class="stone-panel" style="background: linear-gradient(180deg, #4e342e 0%, #3e2723 100%) !important; border-bottom:4px solid var(--wood-border); padding:clamp(4px, 1.5vw, 10px) clamp(6px, 1.5vw, 14px); flex-shrink:0; position:relative; z-index:10; box-shadow:0 4px 16px rgba(0,0,0,0.8);">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:nowrap; gap:clamp(2px, 1vw, 16px);">
        <!-- Pause -->
        <button id="btnPause" class="wood-btn" style="padding:clamp(2px, 1vw, 6px) clamp(4px, 1.5vw, 12px); font-size:clamp(0.4rem, 1.5vw, 0.55rem); flex-shrink:0;" data-i18n="btn_pause">⏸️ Pause</button>
        <!-- Stage + Score + Gold -->
        <div style="text-align:center; flex:1; min-width:0;">
          <div style="display:flex; align-items:center; justify-content:center; gap:clamp(2px, 1vw, 12px); white-space:nowrap;">
            <div>
              <span class="hud-label" data-i18n="lbl_run" style="color:#fff;">Stage</span>
              <span class="hud-value" id="lblRunStage">1</span>
            </div>
            <div style="width:2px; height:24px; background:var(--wood-border); box-shadow:1px 0 0 rgba(255,255,255,0.1); flex-shrink:0;"></div>
            <div>
              <span class="hud-label" data-i18n="lbl_score" style="color:#fff;">Score</span>
              <span class="hud-value" id="lblScore">0</span>
            </div>
            <div style="width:2px; height:24px; background:var(--wood-border); box-shadow:1px 0 0 rgba(255,255,255,0.1); flex-shrink:0;"></div>
            <div>
              <span class="hud-label" data-i18n="gold_label" style="color:#fff;">Gold: </span>
              <span class="hud-value" id="lblRunGold" style="color:var(--text-gold);">0</span>
            </div>
          </div>
          
          <!-- Active Buffs -->
          <div id="activeBuffsContainer" style="display:flex; gap:6px; margin-top:6px; justify-content:center; align-items:center; height:26px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; flex-shrink:0;"></div>
        </div>

        <!-- HP -->
        <div style="text-align:right; flex-shrink:0;">
          <span class="hud-label" data-i18n="lbl_hp" style="color:#fff;">HP</span>
          <span class="hud-value green" id="lblHealth">100/100</span>
        </div>
      </div>
    </div>

    <!-- Progress bars row -->
    <div style="margin-top:clamp(2px, 1vw, 6px); padding: 0 clamp(8px, 2vw, 16px) clamp(2px, 1vw, 6px); display:flex; flex-direction:column; gap:2px;">
      <!-- Stage progress -->
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:0;">
        <span class="hud-label" style="color:#64b5f6; margin-bottom:2px;" data-i18n="lbl_stage_progress">STAGE PROGRESS</span>
      </div>
      <div class="bar-track" style="height:clamp(14px, 3vw, 20px);">
        <div id="barProgress" class="bar-fill bar-fill-prog" style="width:0%; height:100%;"></div>
      </div>
      <!-- Boss HP -->
      <div id="bossHpContainer" style="display:none;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:0;">
          <span class="hud-label" style="color:#ff5252; margin-bottom:2px; animation:pulse-glow 1.5s infinite;" data-i18n="lbl_boss_hp">BOSS HP</span>
        </div>
        <div class="bar-track" style="height:clamp(14px, 3vw, 20px);">
          <div id="barBossHp" class="bar-fill bar-fill-boss" style="width:100%; height:100%;"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ── BATTLE ARENA ───────────────────────────────── -->
  <main id="gameArenaWrapper">

    <div id="arenaFloor" class="arena-floor"></div>

    <!-- Countdown Overlay -->
    <div id="countdownOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:9999; pointer-events:none;">
      <div id="countdownText" class="font-minecraft"
        style="font-size:clamp(2rem,15vw,9rem); color:var(--text-gold); text-shadow:4px 4px 0 rgba(0,0,0,0.9); opacity:0; transform:scale(0.5);">
        3
      </div>
    </div>

    <!-- Damage overlays -->
    <div id="damageFlash" style="display:none; position:absolute; inset:0; background:rgba(255,0,0,0.4); z-index:30; pointer-events:none; mix-blend-mode:multiply;"></div>
    
    <!-- Combat Text -->
    <div id="combatText" style="opacity:0; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:50; pointer-events:none;"></div>
    
    <span id="lblCombo" class="absolute top-12 left-1/2 -translate-x-1/2 font-minecraft font-bold text-yellow-300 text-xl md:text-3xl drop-shadow-[2px_2px_0_#000] hidden whitespace-nowrap z-50 transition-transform duration-200"></span>
    
    <!-- Calculation Animation Overlay -->
    <div id="calcAnimContainer" class="hidden" style="position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); backdrop-filter:blur(2px);">
      <div id="calcAnimContent" style="font-size:clamp(1.2rem, 6vw, 3rem); font-family:'Press Start 2P', monospace; text-shadow:2px 2px 0 #000; color:#fff; text-align:center; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; line-height:1.5;"></div>
    </div>
    
    <!-- Arena Canvas -->
    <div id="arenaContent" style="position:absolute; inset:0; z-index:10;">
      <!-- Hero -->
      <div id="playerSpriteContainer" style="position:absolute; left:5%; bottom:20px;">
        <div id="playerSprite" style="font-size:clamp(4.5rem,12vw,7.5rem); filter:drop-shadow(2px 4px 0 rgba(0,0,0,0.6)); transition:transform 0.1s; transform-origin:bottom center;">
          🧍
        </div>
      </div>
      <!-- Enemy -->
      <div id="enemyContainer" style="position:absolute; right:5%; bottom:20px; text-align:center;">
        <div id="enemySprite" style="font-size:clamp(4rem,10vw,6rem); filter:drop-shadow(2px 4px 0 rgba(0,0,0,0.6)); transition:transform 0.2s; transform-origin:bottom center;">
          🦇
        </div>
        <!-- Attack intent indicator -->
        <div id="attackIntent" style="display:none; position:absolute; top:-40px; left:50%; transform:translateX(-50%); font-size:1.5rem; filter:drop-shadow(1px 1px 0 #000); animation:bounce 1s infinite;">
          ⚠️
        </div>
      </div>
    </div>
  </main>

  <!-- ── FOOTER UI ──────────────────────────────────── -->
  <footer id="questionFooter">
    <div id="lblQuestion" class="font-minecraft text-white text-center mb-4 text-2xl drop-shadow-md">
      Get Ready!
    </div>
    
    <div id="timerContainer" style="margin-bottom:16px;">
      <div class="bar-track" style="height:12px; background:#4e342e;">
        <div id="barTimer" class="bar-fill" style="background:#ffb300; width:100%; height:12px; transition:width 0.1s linear;"></div>
      </div>
    </div>

    <div id="answerGrid">
      <button class="wood-btn btn-answer" id="btnAns0"></button>
      <button class="wood-btn btn-answer" id="btnAns1"></button>
      <button class="wood-btn btn-answer" id="btnAns2"></button>
      <button class="wood-btn btn-answer" id="btnAns3"></button>
    </div>
  </footer>

  <!-- ── RUN OVER MODAL ──────────────────────────────── -->
  <div class="terra-modal-overlay" id="runOverModal">
    <div class="terra-modal-card">
    <div style="margin-bottom:16px;">
      <h2 class="fancy-header" data-i18n="modal_run_over">Stage Cleared / Failed</h2>
    </div>
      <p id="runOverMessage" style="font-family:'Comic Neue',cursive; font-weight:700; font-size:1.1rem; color:var(--text-dim); margin-bottom:24px; text-align:center;" data-i18n="msg_bravely">You fought bravely.</p>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; background:#263238; border:4px solid var(--panel-border); padding:16px; margin-bottom:24px; box-shadow:inset 2px 2px 0 rgba(0,0,0,0.5);">
        <div style="text-align:center;">
          <span class="hud-label" data-i18n="lbl_score">Score</span>
          <span class="hud-value" id="finalScore" style="font-size:1.2rem;">0</span>
        </div>
        <div style="text-align:center;">
          <span class="hud-label" data-i18n="gold_label">Gold Earned</span>
          <span class="hud-value" id="finalGold" style="font-size:1.2rem;">0</span>
        </div>
      </div>

      <div id="recommendationBox" class="hidden" style="margin-bottom:24px; text-align:center; background:rgba(255,255,255,0.1); padding:12px; border-radius:8px; border: 2px solid var(--text-gold);">
        <p style="color:var(--text-gold); font-size:0.6rem; font-family:'Press Start 2P',monospace; margin-bottom:8px;">Recommendation</p>
        <p style="color:#fff; font-size:1.1rem; font-family:'Comic Neue',cursive; margin-bottom:12px; font-weight:bold;">Practice <span id="recSubject" style="color:var(--text-gold);"></span>!</p>
        <button id="btnPracticeRec" class="wood-btn" style="padding:6px 12px; font-size:0.6rem; margin:auto;">Start Practice</button>
      </div>

      <button id="btnReturnHub" class="wood-btn" style="width:100%;" data-i18n="btn_return_hub">Return to Camp</button>
    </div>
  </div>

  <!-- ── REWARD MODAL ────────────────────────────────── -->
  <div class="terra-modal-overlay" id="rewardModal">
    <div class="terra-modal-card" style="max-width:560px;">
    <div style="margin-bottom:16px;">
      <h2 class="fancy-header" data-i18n="modal_reward">BOSS DEFEATED!</h2>
    </div>
      <p style="font-family:'Press Start 2P',monospace; font-size:0.6rem; color:var(--text-dim); text-align:center; margin-bottom:24px; text-shadow:1px 1px 0 rgba(0,0,0,0.8);" data-i18n="msg_reward">Choose your loot...</p>
      
      <div id="rewardCardsContainer" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:16px;"></div>
    </div>
  </div>

  <!-- ── PAUSE MODAL ─────────────────────────────────── -->
  <div class="terra-modal-overlay" id="pauseModal">
    <div class="terra-modal-card">
      <div style="margin-bottom:16px;">
        <h2 class="fancy-header" data-i18n="txt_paused">PAUSED</h2>
      </div>
      
      <div style="display:flex; flex-direction:column; gap:24px; margin-bottom:32px;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <label for="musicVolumeSlider" style="margin:0;"><span style="font-size:1.2rem; vertical-align:middle; margin-right:4px;">🎵</span> <span data-i18n="lbl_music_volume">Music</span></label>
          <div style="display:flex; align-items:center; gap:12px;">
            <input type="range" id="musicVolumeSlider" min="0" max="100" value="50" style="width:100px; padding:0; height:12px; border:none; accent-color:var(--text-gold); cursor:pointer; box-shadow:none;">
            <span id="musicVolumeValue" style="font-family:'Press Start 2P',monospace; font-size:0.6rem; color:var(--text-gold); min-width:3rem; text-shadow:1px 1px 0 rgba(0,0,0,0.8);">50%</span>
          </div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <label for="sfxVolumeSlider" style="margin:0;"><span style="font-size:1.2rem; vertical-align:middle; margin-right:4px;">🔊</span> <span data-i18n="lbl_sfx_volume">SFX</span></label>
          <div style="display:flex; align-items:center; gap:12px;">
            <input type="range" id="sfxVolumeSlider" min="0" max="100" value="70" style="width:100px; padding:0; height:12px; border:none; accent-color:var(--text-gold); cursor:pointer; box-shadow:none;">
            <span id="sfxVolumeValue" style="font-family:'Press Start 2P',monospace; font-size:0.6rem; color:var(--text-gold); min-width:3rem; text-shadow:1px 1px 0 rgba(0,0,0,0.8);">70%</span>
          </div>
        </div>
      </div>
      
      <div style="display:flex; gap:16px;">
        <button id="btnResumePause" class="wood-btn success" style="flex:1;" data-i18n="btn_resume">Resume</button>
        <button id="btnQuitPause" class="wood-btn danger" style="flex:1;" data-i18n="btn_return_hub">Return to Camp</button>
      </div>
    </div>
  </div>

<script src="locales.js"></script>
<script src="sfx.js"></script>
<script src="tutorial.js"></script>
<script src="play.js"></script>
</body>
</html>
